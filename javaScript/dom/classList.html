<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .redbox {
            height: 200px;
            width: 200px;
            background-color: red;
        }
        
        .greenbox {
            height: 200px;
            width: 200px;
            background-color: green;
        }
        
        .margin_auto {
            margin: 0px auto;
            margin-top: 10px;
            display: grid;
            transition: 0.4s;
            place-content: center;
        }
        .blink {
            animation: animate 1s ease infinite;
        }
        .blink1 {
            animation: animate1 1s ease infinite;
        }
        .button-com {
            text-transform: uppercase;
            padding: 0.5rem 1.5rem;
            display: block;
            border: none;
            box-shadow: 0px 0px 10px 2px rgba(0, 0, 255,0.5);
        }

        .radius {
            border-radius: 50%;
            background-color: green;
        }
        @keyframes animate {
            0% {
                background-color: green;
            }
            50% {
                background-color: yellow;
                transform: translateX(20px);
            }
            100% {
                background-color: blue;
                transform: translateX(40px);
            }
        }
        @keyframes animate1 {
            0% {
                background-color: green;
                transform: translateY(0);
            }
            50% {
                background-color: yellow;
                transform: translateY(20px);
            }
            75% {
                transform: translateY(50px);
            }
            100% {
                background-color: blue;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="redbox margin_auto">RED BOX</div>
    <div class="greenbox margin_auto">GREEN BOX</div>
    <button class="button-com button margin_auto">click</button>
    <!-- <button class="default button-com margin_auto">default</button> -->
    <script>
        let redbox = document.querySelector(".redbox");
        let greenbox = document.querySelector(".greenbox");
        let btn = document.querySelector(".button");
        let btn1 = document.querySelector(".default");

        btn.addEventListener("click", () => {
            // redbox.classList.add("radius");
            // greenbox.classList.add('radius');
            redbox.classList.toggle("radius");
            redbox.classList.add('blink');
            greenbox.classList.add('blink1');
            greenbox.classList.toggle("radius");


        })
        // btn1.addEventListener("click", () => {
        //     redbox.classList.remove("radius");
        //     greenbox.classList.remove('radius');
        // })
    </script>
</body>

</html>
