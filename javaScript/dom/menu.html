<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://kit.fontawesome.com/a4a2f04dfd.js" crossorigin="anonymous"></script>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        ul {
            list-style: none;
        }

        a {
            text-decoration: none;
        }

        header {
            position: relative;
            display: flex;
            justify-content: space-between;
            background-color: black;
            align-items: center;
            padding: 8px 24px;
        }

        header .logo img {
            height: 3.125rem;
            width: 3.125rem;
            border-radius: 50%;
        }

        header a,
        .header__option a {
            color: white;
            text-transform: capitalize;
            padding: 8px 24px;
        }

        header .header__option a:hover,
        .side_menu a:hover,
        .menu_bar:hover {
            background-color: orange;
            border-radius: .625rem;
        }

        .menu_bar {
            display: none;
            padding: 0.5rem 1.5rem;
            color: white;
            background-color: orange;
            border: none;
        }

        ul {
            display: flex;
            gap: 2rem;

        }

        .open {
            display: block !important;
        }
        .hero {
            height: 100vh;
            background-color: green;
        }
        .fix_header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 999;
        }
        body{
            height: 5000px;
        }
        .top {
            position: fixed;
            left: 50%;
            bottom: 10%;
            padding: 0.5rem 1.5rem;
            background-color: green;
            color: white;
            display: none;
            z-index: 999;
            border: none;
        }
        @media(max-width: 61.9375rem) {
            .menu_bar {
                display: block;
            }

            header nav {
                position: absolute;
                top: 0;
                left: 0;
                min-width: 21.875rem;
                background-color: #005200;
                height: 100vh;
                padding: 3.125rem;
            }

            #menu {
                display: none;
            }

            header nav ul {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <img src="kagura.jpg" alt="">
        </div>
        <nav id="menu">
            <div class="header__option">
                <ul>
                    <button id="close" class="menu_bar">close</button>
                    <li><a href="#">home</a></li>
                    <li><a href="#">contact us</a></li>
                    <li><a href="#">about us</a></li>
                    <li><a href="#">our plan</a></li>
                </ul>
            </div>
        </nav>
        <button id="bar" class="menu_bar">Show</button>
    </header>
    <button class="top">Go to top</button>
    <script>
        let menu = document.querySelector('#menu');
        let bar = document.querySelector('#bar');
        let close = document.querySelector("#close");
        let header = document.querySelector('header');
        let goTop = document.querySelector('.top');
        bar.addEventListener("click", () => {
            menu.classList.add("open");
        })
        close.addEventListener("click", () => {
            menu.classList.remove('open');
        })
        window.addEventListener("scroll", () =>{
            if(window.scrollY > 500){
            header.classList.add('fix_header');
            }
            else {
                header.classList.remove('fix_header')
            }
            if(window.scrollY > 2000) {
                goTop.style.display = "block";
            }else {
                goTop.style.display = "none";
            }
        })
        goTop.addEventListener("click", () => {
            console.log("heel");
        })
    </script>
</body>

</html>
