<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        a {
            text-decoration: none;
        }

        ul {
            list-style: none;
        }

        :root {
            --primary-color: orange;
        }

        header {
            background-color: black;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 64px;
        }

        header .logo img {
            height: 75px;
            width: 75px;
            border-radius: 50%;
        }

        nav ul {
            display: flex;
            gap: 20px;
        }

        header nav ul li a {
            text-transform: capitalize;
            color: white;
        }

        .padding_com {
            font-weight: 500;
            padding: 0.3rem 1rem;
        }

        .padding_com:hover {
            background-color: var(--primary-color);
            border-radius: 1rem;
        }

        .btn {
            text-transform: capitalize;
            border: none;
            display: none;
            border-radius: 5px;
        }
        
        .btn:hover {
            color: white;
        }

        .close {
            width: fit-content;
            border: none;
            background-color: transparent;
            color: white;
            font-size: 25px;
            font-weight: 600;
            display: none;
        }

        @media(max-width: 991px) {

            .btn,
            .close {
                display: block;
            }

            ul {
                position: absolute;
                top: 0;
                left: 0;
                flex-direction: column;
                background-color: green;
                width: 500px;
                height: 100vh;
                padding: 1rem 3rem;
            }
            nav {
                display: none;
            }
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">
            <img src="kagura.jpg" alt="">
        </div>
        <nav id="menu">
            <ul>
                <button id="btn-close" class="close padding_com">X</button>
                <li><a class="padding_com" href="#">home</a></li>
                <li><a class="padding_com" href="#">contact us</a></li>
                <li><a class="padding_com" href="#">our service</a></li>
                <li><a class="padding_com" href="#">feed back</a></li>
                <li><a class="padding_com" href="#">about us</a></li>
            </ul>
        </nav>
        <button class="btn padding_com" id="btn-open">menu bar</button>
    </header>

    <script>
        let menu = document.querySelector('#menu');
        let btn_open = document.querySelector("#btn-open");
        let btn_close = document.querySelector("#btn-close");
        btn_open.addEventListener("click", ()=> {
            menu.style.display = "block";
        })
        btn_close.addEventListener("click", () => {
            menu.style.display = "none";
        })
    </script>
</body>

</html>
