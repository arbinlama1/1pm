<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>This is about the javaScript Event </h1>
    <form action="">
        <label for="name">FirstName</label>
        <input type="text" class="firstname" id="name">
        <label for="lname">Last Name</label>
        <input type="text" class="lastname" id="lname">
        <p id="para"></p>
        <button id="btn">Submit</button>
    </form>
    <script>
        let firstname = document.getElementById("name").value.trim();
        let lastname = document.getElementById("lname").value.trim();
        let para = document.getElementById("para")
        let btn = document.getElementById('btn');

        btn.addEventListener("click", (e) => {
            e.preventDefault();
            console.log("hello ");

            if (firstname == "" && lastname == "") {
                alert("Please Enter your first and last name");
            }
            else {
                let result = firstname + " " + lastname;
                para.innerHTML = "Full Name is " + result;
            }
        })
    </script>
</body>
</html>
