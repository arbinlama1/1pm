<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .container {
            height: 500px;
            width: 400px;
            background-color: red;
            position: relative;
        }
        .content {
            height: 100px;
            width: 100px;
            background-color: green;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #btn {
            padding: 15px 20px;
            font-size: 20px;
            font-weight: 600;
            margin: 50px;
            color: green;
            border-radius: 40px;
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            border: none;
        }
       
        #btn:hover {
            background-color: rgb(12, 12, 179);
            color: white;
        }
        #btn:hover i{
            transition: 0.8s;
            transform: translate(15px);
        }
        .time-section {
            display: flex;
            gap: 100px;
            width: 100%;
            height: 100vh;
            margin: 50px;
        }
        .rotate {
            height: 200px;
            width: 200px;
            background-color: black;
            transform: rotate(45deg);
            border: 5px solid rgb(124, 161, 161);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .rotate__para {
            color: white;
            font-size: 25px;
            transform: rotate(-45deg);
            font-weight: 700;
            /* text-align: center; */
        }
      
        .rotate__para::first-letter {
            color: aqua;
        }
        .img_practice {
            margin: 50px;
        }
       img {
        height: 100%;
        width: 100%;
        object-fit: cover;
        transition: 0.4s;
       }

       figure {
        height: 400px;
        width: 400px;
        background-color: orange;
        overflow: hidden;
       }
       figure:hover img {
        transform: scale(1.4);
       }
    </style>
</head>
<body>
    <div class="container">
        <div class="content"></div>
    </div>

    <h1>This is button for practice</h1>
    <button id="btn">Book Now <i class="fa-solid fa-arrow-right"></i></button>


    <br><br>
    <h1>This is about the rotate</h1>
    <div class="time-section">
   <div class="rotate">
        <p class="rotate__para rotate__para--1">00
            <span>Days</span>
        </p>
    </div>
     <div class="rotate">
        <p class="rotate__para rotate__para--1">00
            <span>Days</span>
        </p>
    </div>
     <div class="rotate">
        <p class="rotate__para rotate__para--1">00
            <span>Days</span>
        </p>
    </div>
     <div class="rotate">
        <p class="rotate__para rotate__para--1">00
            <span>Days</span>
        </p>
    </div>
     <div class="rotate">
        <p class="rotate__para rotate__para--1">00
            <span>Days</span>
        </p>
    </div>
</div>
<div class="img_practice">
    <figure>
        <img src="../image/kagura.jpg" alt="">
    </figure>
</div>
</body>
</html>
