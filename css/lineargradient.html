<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{ 
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        html, body {
            background-color: black;
            color: white;
            text-align: center;
        }
        h1 {
            margin: 20px;
        }
        .container {
            height: 300px;
            width: 100%;
            background-image: linear-gradient(45deg, red, green, aqua, hotpink, orange, blue);
        }
        .linear__trans {
            height: 300px;
            background-image: linear-gradient(to right, rgba(255, 0, 0, 0), rgba(255, 0, 0, 1));
        }
        .rep__linear__grad {
            height: 300px;
            background-image: repeating-linear-gradient(red, aqua 10%, yellow 20%, orange 30%);
        }
    </style>
</head> 
<body>
    <h1>This is about the linear-gradient</h1>
    <div class="container"></div>
    <h1>This is about the linear-gradient with transparency</h1>
    <div class="linear__trans"></div>
    <h1>This is about the repeating-linear-gradient</h1>
    <div class="rep__linear__grad"></div>
</body>
</html>
