<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        html,
        body {
            background-color: black;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            gap: 10px;
            font-size: 30px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="hr" id="hr">00</div>
        <div class="min" id="min">00</div>
        <div class="sec" id="sec">00</div>
    </div>
    <script>
        let hr_para = document.getElementById("hr");
        let min_para = document.getElementById("min");
        let sec_para = document.getElementById("sec");


        let hr = 0;
        let min = 0;
        let sec = 0;

        function second() {
            setInterval(() => {
                sec++;
                if (sec === 60) {
                    sec = 0;
                    min++
                }
                if (min === 60) {
                    min = 0;
                    hr++;
                }
                updateTime();
            },10);
        }
        function format(num) {
            return (num < 10) ? "0" + num : num;
        }

        function updateTime() {
            hr_para.innerHTML = format(hr) + `<span> :</span>`;
            min_para.innerHTML = format(min) +`<span> :</span>`;
            sec_para.innerHTML = format(sec);
        }
        second();
    </script>
</body>

</html>
