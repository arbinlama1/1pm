<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        html, body {
            background-color: black;
            color: white;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            gap: 10px;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: 3px;
        }

        span {
            color: aqua;
        }

        .hr, .min, .sec {
            background-color: antiquewhite;
            color: red;
            padding: 2px 10px;
            border-radius: 5px;
        }

        .sec.flip {
            animation: animate 0.4s ease;
        }

        @keyframes animate {
            from {
                transform: scaleY(1);
            }
            to {
                transform: scaleY(-1);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="hr" class="hr">00</div>
        <div id="min" class="min">00</div>
        <div id="sec" class="sec">00</div>
    </div>

    <script>
        let hr_para = document.getElementById("hr");
        let min_para = document.getElementById("min");
        let sec_para = document.getElementById("sec");

        let hr = 0;
        let min = 0;
        let sec = 0;

        function second() {
            setInterval(() => {
                sec++;
                if (sec === 60) {
                    sec = 0;
                    min++;
                }
                if (min === 60) {
                    min = 0;
                    hr++;
                }
                updateTime();
            }, 500);
        }

        function updateTime() {
            hr_para.innerHTML = format(hr);
            min_para.innerHTML = format(min);
            sec_para.innerText = format(sec);

            // Restart flip animation for seconds
            sec_para.classList.remove("flip");
            void sec_para.offsetWidth; // force reflow
            sec_para.classList.add("flip");
        }

        function format(num) {
            return (num < 10) ? "0" + num : num;
        }

        second();
    </script>
</body>

</html>
